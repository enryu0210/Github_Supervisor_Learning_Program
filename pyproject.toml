[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitcoach"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
gitcoach = "gitcoach.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gitcoach", "src/watcher"]
