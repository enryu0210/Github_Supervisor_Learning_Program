services:
  ollama:
    # latest 는 어느 날 갑자기 바뀌어 발표 직전에 깨질 수 있으므로 버전을 고정한다.
    image: ollama/ollama:0.40.13
    ports:
      # Ollama 에는 인증이 없다. 팀원 PC 의 CLI 는 localhost 로만 접근하면 되므로
      # 같은 와이파이의 다른 사람이 쓰지 못하게 127.0.0.1 에만 연다.
      # PC 에 Ollama 가 이미 설치돼 11434 를 쓰고 있으면 .env 에서 포트를 바꾼다.
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      # 모델은 수 GB 라서 컨테이너를 다시 만들어도 남도록 볼륨에 저장한다.
      - ollama-models:/root/.ollama

  watcher:
    build: ./watcher
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: http://ollama:11434  # 같은 Compose 네트워크에서는 서비스 이름으로 통신한다.
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      # 주의: Next.js 는 NEXT_PUBLIC_* 를 빌드할 때 코드에 박아 넣는다.
      # 실제 앱을 넣을 때는 이 값들을 build.args 로도 넘겨야 한다.
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}

volumes:
  ollama-models:
