name: secret-scan

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 이후 커밋에서 지운 시크릿도 이력에는 남으므로 전체 이력을 검사한다.
          fetch-depth: 0
      # gitleaks-action 은 레포가 조직으로 옮겨지면 라이선스 키가 필요해진다.
      # 실행 파일을 직접 쓰면 그런 조건이 없고, 로컬에서도 같은 명령으로 재현할 수 있다.
      # 릴리스 서버가 가끔 504 를 돌려줘서 PR 내용과 무관하게 실패한 적이 있다(PR #12).
      # 일시 오류는 재시도하고, 한 번에 오래 매달리지 않게 시도마다 60초로 제한한다.
      # 파이프(| tar)로 넘기면 재시도 때 이미 넘긴 데이터를 되돌릴 수 없으므로 파일로 받은 뒤 푼다.
      - name: gitleaks 설치
        run: |
          curl -sSfL --retry 3 --retry-all-errors --max-time 60 \
            -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
      - name: 전체 이력 검사
        run: ./gitleaks git --redact
