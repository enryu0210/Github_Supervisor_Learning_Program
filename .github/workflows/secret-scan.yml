name: secret-scan

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 이후 커밋에서 지운 시크릿도 이력에는 남으므로 전체 이력을 검사한다.
          fetch-depth: 0
      # gitleaks-action 은 레포가 조직으로 옮겨지면 라이선스 키가 필요해진다.
      # 실행 파일을 직접 쓰면 그런 조건이 없고, 로컬에서도 같은 명령으로 재현할 수 있다.
      - name: gitleaks 설치
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
      - name: 전체 이력 검사
        run: ./gitleaks git --redact
