name: pr-convention

on:
  pull_request:
    branches: [develop, main]
    # 제목을 고치거나 base 를 바꿔도 다시 검사한다
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 기본 체크아웃은 PR 병합 미리보기 커밋이다. HEAD^1 = base 최신, HEAD^2 = PR 최신.
          # 두 부모 사이 커밋을 세려면 이력이 필요하다.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e .
      # 브랜치 이름·PR 제목은 PR 작성자가 정하는 값이다. `run:` 안에 ${{ }} 로 바로 넣으면
      # 셸 명령이 주입될 수 있어서, 반드시 환경변수로 넘겨 읽는다.
      - name: 브랜치(R05)·base(R08)·제목과 커밋(R06) 검사
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: git log --no-merges --format=%s HEAD^1..HEAD^2 | python -m watcher.pr_convention
